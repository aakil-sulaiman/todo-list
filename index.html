<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
  /* ===== WINDOWS XP LUNA THEME ===== */
  :root {
    --bg: #ece9d8;
    --surface: #ece9d8;
    --surface-hover: #ddd8ca;
    --border: #0a246a;
    --accent: #316ac5;
    --text: #000000;
    --text-dim: #444444;
    --icon-size: 36px;
    --zone-gap: 24px;
    --zone-padding: 8px;
    --grid-gap: 4px;
    --shortcut-width: 72px;
    --label-size: 10px;
    --zone-radius: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif;
    /* Bliss wallpaper gradient */
    background:
      linear-gradient(to bottom,
        #7ec8e3 0%,
        #5ab5dc 30%,
        #4aa8d0 48%,
        #68bc44 52%,
        #4fa02c 65%,
        #2d7515 80%,
        #1a5508 100%
      );
    background-attachment: fixed;
    background-size: 100% 100%;
    color: var(--text);
    min-height: 100vh;
    padding: 40px 32px 60px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Settings button — XP toolbar button */
  #settings-btn {
    position: fixed;
    top: 8px;
    right: 8px;
    z-index: 300;
    width: 34px;
    height: 26px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    color: #000;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
    border-radius: 3px;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  #settings-btn:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }
  #settings-btn:active {
    background: linear-gradient(to bottom, #a8c8f0 0%, #dde9f8 100%);
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
  }

  /* Settings panel — XP window panel */
  #settings-panel {
    position: fixed;
    top: 0;
    right: -360px;
    width: 340px;
    max-width: 90vw;
    height: 100vh;
    background: #ece9d8;
    border-left: 2px solid #0a246a;
    z-index: 350;
    transition: right 0.25s ease;
    overflow-y: auto;
    padding: 0;
  }
  #settings-panel.open { right: 0; }

  #settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 340;
  }
  #settings-overlay.open { display: block; }

  /* Settings header — XP title bar */
  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to right, #0a246a 0%, #1254a4 20%, #2d84e0 55%, #6db5f5 82%, #c4e4fc 100%);
    padding: 5px 6px 5px 10px;
  }
  .settings-header h3 {
    font-size: 12px;
    font-weight: bold;
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
  }
  .settings-close {
    background: linear-gradient(to bottom, #f2ede6 0%, #c8bfb5 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    color: #000;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    padding: 0;
    width: 21px;
    height: 19px;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 1px 1px 1px rgba(0,0,0,0.2);
    line-height: 1;
  }
  .settings-close:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }

  .setting-group { margin: 12px 16px 0; }
  .setting-group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #316ac5;
    margin-bottom: 8px;
    font-weight: bold;
    border-bottom: 1px solid #7b9ebd;
    padding-bottom: 4px;
  }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .setting-row label { font-size: 11px; color: #000; }
  .setting-row input[type="range"] { width: 120px; accent-color: #316ac5; }
  .setting-row input[type="color"] {
    width: 32px; height: 22px;
    border: 1px solid #7b9ebd;
    border-radius: 2px;
    cursor: pointer;
    padding: 0;
  }
  .setting-value {
    font-size: 11px;
    color: #000;
    min-width: 32px;
    text-align: right;
    margin-left: 6px;
  }

  .settings-actions {
    display: flex;
    gap: 6px;
    margin: 16px;
    padding-top: 12px;
    border-top: 1px solid #7b9ebd;
  }
  .settings-actions button {
    flex: 1;
    padding: 5px 8px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    border-radius: 3px;
    font-size: 11px;
    font-family: Tahoma, sans-serif;
    cursor: pointer;
    color: #000;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.15);
  }
  .btn-export:hover, .btn-import:hover { background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%); border-color: #316ac5; }
  .btn-reset { color: #990000; }
  .btn-reset:hover { background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%); border-color: #316ac5; color: #990000; }

  /* Zones container */
  #zones-container {
    display: flex;
    flex-wrap: wrap;
    gap: var(--zone-gap);
    justify-content: center;
    max-width: 1400px;
    width: 100%;
  }

  /* Zone = XP Window */
  .zone {
    background: #ece9d8;
    border: 2px solid #0a246a;
    border-radius: var(--zone-radius) var(--zone-radius) 4px 4px;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.4), inset 0 0 0 1px #a6caf0;
    padding: 0;
    overflow: hidden;
    min-width: 0;
    position: relative;
  }

  /* Zone header = XP title bar */
  .zone-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to right, #0a246a 0%, #1254a4 20%, #2d84e0 55%, #6db5f5 82%, #c4e4fc 100%);
    padding: 3px 4px 3px 8px;
    gap: 6px;
    border-radius: calc(var(--zone-radius) - 2px) calc(var(--zone-radius) - 2px) 0 0;
    user-select: none;
  }

  .zone-title {
    font-size: 12px;
    font-weight: bold;
    text-transform: none;
    letter-spacing: normal;
    cursor: text;
    border: none;
    background: none;
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    font-family: Tahoma, sans-serif;
    outline: none;
    width: 100%;
  }
  .zone-title::placeholder { color: rgba(255,255,255,0.6); }

  .zone-actions {
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.1s;
  }
  .zone:hover .zone-actions { opacity: 1; }

  .zone-actions button {
    background: linear-gradient(to bottom, #f2ede6 0%, #c8bfb5 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    color: #000;
    cursor: pointer;
    font-size: 11px;
    padding: 0;
    width: 19px;
    height: 17px;
    border-radius: 2px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 1px 1px 1px rgba(0,0,0,0.2);
  }
  .zone-actions button:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }

  /* Zone grid — window body with padding */
  .zone-grid {
    display: grid;
    gap: var(--grid-gap);
    padding: var(--zone-padding);
    background: #ece9d8;
  }

  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #000;
    padding: 8px 6px;
    border-radius: 3px;
    transition: background 0.1s;
    width: var(--shortcut-width);
    cursor: pointer;
    position: relative;
  }
  .shortcut:hover {
    background: rgba(49,106,197,0.15);
    outline: 1px dotted #316ac5;
  }

  .shortcut-icon {
    width: var(--icon-size);
    height: var(--icon-size);
    border-radius: 3px;
    background: #d4d0c8;
    border: 1px solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 4px;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  .shortcut-icon img {
    width: calc(var(--icon-size) - 10px);
    height: calc(var(--icon-size) - 10px);
    object-fit: contain;
  }

  .shortcut-label {
    font-size: var(--label-size);
    color: #000;
    text-align: center;
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.2;
    font-family: Tahoma, sans-serif;
  }

  .shortcut-options-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #fff #7b9ebd #7b9ebd #fff;
    color: #000;
    font-size: 10px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
    padding: 0;
    border-radius: 2px;
  }
  .shortcut:hover .shortcut-options-btn { display: flex; }
  .shortcut-options-btn:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }

  .add-shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: var(--shortcut-width);
    padding: 8px 6px;
    border-radius: 3px;
    border: 1px dashed #7b9ebd;
    background: none;
    color: #444;
    cursor: pointer;
    transition: all 0.1s;
    font-family: Tahoma, sans-serif;
  }
  .add-shortcut:hover {
    border-color: #316ac5;
    color: #316ac5;
    background: rgba(49,106,197,0.08);
  }
  .add-shortcut-icon {
    width: var(--icon-size);
    height: var(--icon-size);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    margin-bottom: 4px;
  }
  .add-shortcut-label { font-size: var(--label-size); }

  /* Add Zone — XP default button (bold border = default) */
  #add-zone-btn {
    margin-top: 24px;
    padding: 6px 20px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 2px solid #316ac5;
    border-radius: 3px;
    color: #000;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.1s;
    font-family: Tahoma, sans-serif;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.25);
  }
  #add-zone-btn:hover {
    background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%);
    border-color: #316ac5;
  }
  #add-zone-btn:active {
    background: linear-gradient(to bottom, #a8c8f0 0%, #dde9f8 100%);
    box-shadow: inset 1px 1px 2px rgba(0,0,0,0.2);
  }

  /* Modal overlay */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }

  /* Modal = XP dialog window */
  .modal {
    background: #ece9d8;
    border: 2px solid #0a246a;
    border-radius: var(--zone-radius) var(--zone-radius) 4px 4px;
    box-shadow: 4px 4px 20px rgba(0,0,0,0.5), inset 0 0 0 1px #a6caf0;
    padding: 14px 20px 20px;
    width: 340px;
    max-width: 90vw;
    overflow: hidden;
  }
  .modal h3 {
    background: linear-gradient(to right, #0a246a 0%, #1254a4 20%, #2d84e0 55%, #6db5f5 82%, #c4e4fc 100%);
    color: white;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    font-size: 12px;
    font-weight: bold;
    font-family: Tahoma, sans-serif;
    padding: 5px 20px;
    margin: -14px -20px 16px;
    border-radius: calc(var(--zone-radius) - 2px) calc(var(--zone-radius) - 2px) 0 0;
  }
  .modal label {
    display: block;
    font-size: 11px;
    color: #000;
    margin-bottom: 3px;
    margin-top: 10px;
    font-family: Tahoma, sans-serif;
  }
  .modal label:first-of-type { margin-top: 0; }
  .modal input {
    width: 100%;
    padding: 4px 6px;
    background: #ffffff;
    border: 2px solid;
    border-color: #7f9db9 #ffffff #ffffff #7f9db9;
    color: #000;
    font-size: 12px;
    font-family: Tahoma, sans-serif;
    outline: none;
    border-radius: 0;
  }
  .modal input:focus { border-color: #316ac5; }
  .modal-row { display: flex; gap: 10px; }
  .modal-row > div { flex: 1; }
  .modal-buttons {
    display: flex;
    gap: 6px;
    justify-content: flex-end;
    margin-top: 16px;
  }
  .modal-buttons button {
    padding: 5px 16px;
    background: linear-gradient(to bottom, #f5f3ee 0%, #ddd8cc 100%);
    border: 1px solid;
    border-color: #ffffff #7b9ebd #7b9ebd #ffffff;
    border-radius: 3px;
    font-size: 11px;
    font-family: Tahoma, sans-serif;
    cursor: pointer;
    color: #000;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    min-width: 75px;
  }
  .btn-cancel:hover { background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%); border-color: #316ac5; }
  /* Confirm = default button (bold border) */
  .btn-confirm { border: 2px solid #316ac5; }
  .btn-confirm:hover { background: linear-gradient(to bottom, #dde9f8 0%, #a8c8f0 100%); }

  /* Context menu — XP popup menu */
  .ctx-menu {
    display: none;
    position: fixed;
    background: #ece9d8;
    border: 1px solid #7b9ebd;
    border-radius: 0;
    padding: 2px;
    z-index: 200;
    min-width: 160px;
    box-shadow: 3px 3px 6px rgba(0,0,0,0.3);
  }
  .ctx-menu.active { display: block; }
  .ctx-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: #000;
    padding: 4px 20px;
    font-size: 11px;
    cursor: pointer;
    border-radius: 0;
    font-family: Tahoma, sans-serif;
  }
  .ctx-menu button:hover { background: #316ac5; color: white; }
  .ctx-menu button.danger { color: #990000; }
  .ctx-menu button.danger:hover { background: #316ac5; color: white; }
  .ctx-menu hr { border: none; border-top: 1px solid #7b9ebd; margin: 2px 4px; }

  #icon-file-input, #import-file-input { display: none; }

  /* Clock widget */
  #clock-widget {
    text-align: center;
    margin-bottom: 24px;
    user-select: none;
  }
  #clock-time {
    font-size: 52px;
    font-weight: bold;
    letter-spacing: 2px;
    color: white;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.7), 0 0 20px rgba(0,0,0,0.3);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    font-family: Tahoma, sans-serif;
  }
  #clock-date {
    font-size: 14px;
    color: white;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
    margin-top: 6px;
    letter-spacing: 0.5px;
    font-family: Tahoma, sans-serif;
  }

  /* Search bar — XP sunken input */
  #search-container {
    width: 100%;
    max-width: 540px;
    margin-bottom: 32px;
    position: relative;
  }
  #search-input {
    width: 100%;
    padding: 6px 42px 6px 10px;
    background: #ffffff;
    border: 2px solid;
    border-color: #7f9db9 #ffffff #ffffff #7f9db9;
    color: #000;
    font-size: 12px;
    font-family: Tahoma, sans-serif;
    outline: none;
    transition: border-color 0.1s;
    border-radius: 0;
  }
  #search-input:focus {
    border-color: #316ac5;
    box-shadow: 0 0 0 1px #316ac5;
  }
  #search-input::placeholder { color: #7b9ebd; }

  #search-hint {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 11px;
    color: #7b9ebd;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    font-family: Tahoma, sans-serif;
  }
  #search-input:not(:placeholder-shown) ~ #search-hint { opacity: 1; }

  .shortcut.search-hidden { display: none; }
  .shortcut.search-dim { opacity: 0.3; }
  .shortcut.search-match {
    outline: 2px solid #316ac5;
    outline-offset: 2px;
    background: rgba(49,106,197,0.15);
  }

  /* ===== XP TASKBAR ===== */
  #xp-taskbar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30px;
    background: linear-gradient(to bottom,
      #245fd8 0%,
      #2f74ea 4%,
      #1d6ae0 8%,
      #1662d6 50%,
      #1454ba 90%,
      #0f45a8 100%
    );
    border-top: 2px solid #0a246a;
    display: flex;
    align-items: center;
    z-index: 9999;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.4);
    user-select: none;
  }

  /* XP Start button */
  #xp-start-btn {
    height: 100%;
    padding: 0 14px 0 8px;
    background: linear-gradient(to bottom,
      #5ecb2c 0%,
      #3faa18 30%,
      #2c8f0c 70%,
      #1c7006 100%
    );
    border: none;
    border-right: 1px solid rgba(0,0,0,0.3);
    border-radius: 0 14px 14px 0;
    color: white;
    font-weight: bold;
    font-size: 13px;
    font-family: 'Franklin Gothic Medium', Tahoma, sans-serif;
    font-style: italic;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
    min-width: 88px;
    box-shadow: 2px 0 6px rgba(0,0,0,0.3);
    letter-spacing: 0.5px;
  }
  #xp-start-btn:hover { filter: brightness(1.12); }
  #xp-start-btn:active { filter: brightness(0.9); }

  #xp-start-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f8c43a, #e85c18 60%, #c23810);
    box-shadow: 0 0 4px rgba(255,100,0,0.6);
    flex-shrink: 0;
  }

  #xp-taskbar-middle { flex: 1; }

  #xp-tray {
    display: flex;
    align-items: center;
    padding: 0 10px;
    height: 100%;
    background: linear-gradient(to bottom,
      #1458c4 0%,
      #1050b8 50%,
      #0a40a0 100%
    );
    border-left: 1px solid #0a40a0;
    min-width: 64px;
    justify-content: center;
  }
  #xp-tray-time {
    color: white;
    font-size: 11px;
    font-family: Tahoma, sans-serif;
    text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
    white-space: nowrap;
  }
</style>
</head>
<body>

<button id="settings-btn" title="Settings">&#9881;</button>
<div id="settings-overlay"></div>
<div id="settings-panel">
  <div class="settings-header">
    <h3>Settings</h3>
    <button class="settings-close" id="settings-close">&times;</button>
  </div>

  <div class="setting-group">
    <div class="setting-group-title">Icons</div>
    <div class="setting-row">
      <label>Icon Size</label>
      <input type="range" id="s-icon-size" min="24" max="64" step="2">
      <span class="setting-value" id="v-icon-size"></span>
    </div>
    <div class="setting-row">
      <label>Shortcut Width</label>
      <input type="range" id="s-shortcut-width" min="48" max="120" step="2">
      <span class="setting-value" id="v-shortcut-width"></span>
    </div>
    <div class="setting-row">
      <label>Label Size</label>
      <input type="range" id="s-label-size" min="8" max="16" step="1">
      <span class="setting-value" id="v-label-size"></span>
    </div>
  </div>

  <div class="setting-group">
    <div class="setting-group-title">Layout</div>
    <div class="setting-row">
      <label>Grid Gap</label>
      <input type="range" id="s-grid-gap" min="0" max="16" step="1">
      <span class="setting-value" id="v-grid-gap"></span>
    </div>
    <div class="setting-row">
      <label>Zone Padding</label>
      <input type="range" id="s-zone-padding" min="4" max="32" step="2">
      <span class="setting-value" id="v-zone-padding"></span>
    </div>
    <div class="setting-row">
      <label>Zone Gap</label>
      <input type="range" id="s-zone-gap" min="8" max="48" step="2">
      <span class="setting-value" id="v-zone-gap"></span>
    </div>
    <div class="setting-row">
      <label>Zone Radius</label>

<input type="file" id="import-file-input" accept=".json">

<script>
const STORAGE_KEY = 'landing_zones_v1';
const SETTINGS_KEY = 'landing_settings_v1';
const FAVICON_CACHE_KEY = 'landing_favicons_v1';

const DEFAULT_SETTINGS = {
  iconSize: 36, shortcutWidth: 72, labelSize: 10,
  gridGap: 4, zonePadding: 8, zoneGap: 24, zoneRadius: 8,
  bgColor: '#3a7a19', surfaceColor: '#ece9d8', accentColor: '#316ac5'
};

let zones = loadData();
let settings = loadSettings();
let faviconCache = loadFaviconCache();
let activeZoneId = null;
let editingZoneId = null;
let editingShortcut = null;
let scCtxTarget = null;

function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : []; }
  catch { return []; }
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(zones)); }

function loadSettings() {
  try { const r = localStorage.getItem(SETTINGS_KEY); return r ? { ...DEFAULT_SETTINGS, ...JSON.parse(r) } : { ...DEFAULT_SETTINGS }; }
  catch { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }

function loadFaviconCache() {
  try { const r = localStorage.getItem(FAVICON_CACHE_KEY); return r ? JSON.parse(r) : {}; }
  catch { return {}; }
}
function saveFaviconCache() {
  try { localStorage.setItem(FAVICON_CACHE_KEY, JSON.stringify(faviconCache)); }
  catch {} // quota exceeded — ignore
}
function fetchAndCacheFavicon(url, img) {
  const faviconUrl = getFaviconUrl(url);
  const tempImg = new Image();
  tempImg.crossOrigin = 'anonymous';
  tempImg.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = tempImg.naturalWidth || 64;
      canvas.height = tempImg.naturalHeight || 64;
      canvas.getContext('2d').drawImage(tempImg, 0, 0);
      const dataUrl = canvas.toDataURL('image/png');
      faviconCache[url] = dataUrl;
      saveFaviconCache();
      if (img && img.src !== dataUrl) img.src = dataUrl;
    } catch {} // canvas tainted by CORS — image still displays, just won't cache
  };
  tempImg.src = faviconUrl;
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function getFaviconUrl(url) {
  try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; }
  catch { return ''; }
}

function labelFromUrl(url) {
  try { return new URL(url).hostname.replace(/^www\./, '').split('.')[0]; }
  catch { return 'Link'; }
}

function applySettings() {
  const r = document.documentElement.style;
  r.setProperty('--icon-size', settings.iconSize + 'px');
  r.setProperty('--shortcut-width', settings.shortcutWidth + 'px');
  r.setProperty('--label-size', settings.labelSize + 'px');
  r.setProperty('--grid-gap', settings.gridGap + 'px');
  r.setProperty('--zone-padding', settings.zonePadding + 'px');
  r.setProperty('--zone-gap', settings.zoneGap + 'px');
  r.setProperty('--zone-radius', settings.zoneRadius + 'px');
  r.setProperty('--bg', settings.bgColor);
  r.setProperty('--surface', settings.surfaceColor);
  r.setProperty('--accent', settings.accentColor);
}

function syncSettingsUI() {
  const map = {
    's-icon-size': ['iconSize', 'v-icon-size', 'px'],
    's-shortcut-width': ['shortcutWidth', 'v-shortcut-width', 'px'],
    's-label-size': ['labelSize', 'v-label-size', 'px'],
    's-grid-gap': ['gridGap', 'v-grid-gap', 'px'],
    's-zone-padding': ['zonePadding', 'v-zone-padding', 'px'],
    's-zone-gap': ['zoneGap', 'v-zone-gap', 'px'],
    's-zone-radius': ['zoneRadius', 'v-zone-radius', 'px'],
  };
  for (const [inputId, [key, valId, unit]] of Object.entries(map)) {
    document.getElementById(inputId).value = settings[key];
    document.getElementById(valId).textContent = settings[key] + unit;
  }
  document.getElementById('s-bg-color').value = settings.bgColor;
  document.getElementById('s-surface-color').value = settings.surfaceColor;
  document.getElementById('s-accent-color').value = settings.accentColor;
}

function bindSettingsInputs() {
  const rangeMap = {
    's-icon-size': 'iconSize', 's-shortcut-width': 'shortcutWidth',
    's-label-size': 'labelSize', 's-grid-gap': 'gridGap',
    's-zone-padding': 'zonePadding', 's-zone-gap': 'zoneGap',
    's-zone-radius': 'zoneRadius',
  };
  for (const [inputId, key] of Object.entries(rangeMap)) {
    document.getElementById(inputId).addEventListener('input', (e) => {
      settings[key] = parseInt(e.target.value);
      applySettings(); syncSettingsUI(); saveSettings(); render();
    });
  }
  document.getElementById('s-bg-color').addEventListener('input', (e) => {
    settings.bgColor = e.target.value; applySettings(); saveSettings();
  });
  document.getElementById('s-surface-color').addEventListener('input', (e) => {
    settings.surfaceColor = e.target.value; applySettings(); saveSettings(); render();
  });
  document.getElementById('s-accent-color').addEventListener('input', (e) => {
    settings.accentColor = e.target.value; applySettings(); saveSettings(); render();
  });
}

function openSettings() {
  syncSettingsUI();
  document.getElementById('settings-panel').classList.add('open');
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-panel').classList.remove('open');
  document.getElementById('settings-overlay').classList.remove('open');
}

document.getElementById('settings-btn').addEventListener('click', openSettings);
document.getElementById('settings-close').addEventListener('click', closeSettings);
document.getElementById('settings-overlay').addEventListener('click', closeSettings);

document.getElementById('btn-reset-settings').addEventListener('click', () => {
  settings = { ...DEFAULT_SETTINGS };
  applySettings(); syncSettingsUI(); saveSettings(); render();
});

document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify({ zones, settings }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'landing-page-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('import-file-input').click();
});

document.getElementById('import-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data)) { zones = data; }
      else if (data.zones) {
        zones = data.zones;
        if (data.settings) { settings = { ...DEFAULT_SETTINGS, ...data.settings }; applySettings(); syncSettingsUI(); saveSettings(); }
      }
      saveData(); render();
    } catch { alert('Invalid JSON file.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function render() {
  const container = document.getElementById('zones-container');
  container.innerHTML = '';

  zones.forEach(zone => {
    const el = document.createElement('div');
    el.className = 'zone';
    el.dataset.id = zone.id;

    const header = document.createElement('div');
    header.className = 'zone-header';
    const title = document.createElement('input');
    title.className = 'zone-title';
    title.value = zone.name;
    title.spellcheck = false;
    title.addEventListener('change', () => { zone.name = title.value || 'Untitled'; saveData(); });

    const actions = document.createElement('div');
    actions.className = 'zone-actions';
    const moreBtn = document.createElement('button');
    moreBtn.textContent = '\u22EF';
    moreBtn.title = 'Zone options';
    moreBtn.addEventListener('click', (e) => { e.stopPropagation(); showCtxMenu(e.clientX, e.clientY, zone.id); });
    actions.appendChild(moreBtn);
    header.appendChild(title);
    header.appendChild(actions);
    el.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'zone-grid';
    grid.style.gridTemplateColumns = `repeat(${zone.cols}, var(--shortcut-width))`;

    zone.shortcuts.forEach((sc, idx) => {
      const a = document.createElement('a');
      a.className = 'shortcut';
      a.href = sc.url;
      a.title = sc.url;
      a.draggable = true;
      a.dataset.zoneId = zone.id;
      a.dataset.scIdx = idx;
      a.addEventListener('dragstart', onDragStart);
      a.addEventListener('dragover', onDragOver);
      a.addEventListener('drop', onDrop);

      const iconWrap = document.createElement('div');
      iconWrap.className = 'shortcut-icon';
      const img = document.createElement('img');
      const cachedSrc = sc.customIcon || faviconCache[sc.url];
      img.src = cachedSrc || getFaviconUrl(sc.url);
      img.alt = '';
      img.loading = 'eager';
      if (!cachedSrc) fetchAndCacheFavicon(sc.url, img);
      img.onerror = () => {
        img.style.display = 'none';
        iconWrap.textContent = sc.label[0]?.toUpperCase() || '?';
        iconWrap.style.fontSize = '16px';
        iconWrap.style.color = '#8892a4';
      };
      iconWrap.appendChild(img);

      const label = document.createElement('span');
      label.className = 'shortcut-label';
      label.textContent = sc.label;

      const optBtn = document.createElement('button');
      optBtn.className = 'shortcut-options-btn';
      optBtn.textContent = '\u22EF';
      optBtn.title = 'Options';
      optBtn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        showScCtxMenu(e.clientX, e.clientY, zone.id, idx);
      });

      a.appendChild(iconWrap);
      a.appendChild(label);
      a.appendChild(optBtn);
      grid.appendChild(a);
    });

    const maxSlots = zone.cols * zone.rows;
    if (zone.shortcuts.length < maxSlots) {
      const addBtn = document.createElement('button');
      addBtn.className = 'add-shortcut';
      addBtn.addEventListener('click', () => openShortcutModal(zone.id));
      const addIcon = document.createElement('div');
      addIcon.className = 'add-shortcut-icon';
      addIcon.textContent = '+';
      const addLabel = document.createElement('span');
      addLabel.className = 'add-shortcut-label';
      addLabel.textContent = 'Add';
      addBtn.appendChild(addIcon);
      addBtn.appendChild(addLabel);
      grid.appendChild(addBtn);
    }

    el.appendChild(grid);
    container.appendChild(el);
  });
}

let dragData = null;
function onDragStart(e) {
  dragData = { zoneId: e.currentTarget.dataset.zoneId, scIdx: parseInt(e.currentTarget.dataset.scIdx) };
  e.currentTarget.style.opacity = '0.4';
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function onDrop(e) {
  e.preventDefault();
  const toZoneId = e.currentTarget.dataset.zoneId;
  const toIdx = parseInt(e.currentTarget.dataset.scIdx);
  if (!dragData) return;
  const fromZone = zones.find(z => z.id === dragData.zoneId);
  const toZone = zones.find(z => z.id === toZoneId);
  if (!fromZone || !toZone) return;
  if (fromZone.id === toZone.id) {
    const [item] = fromZone.shortcuts.splice(dragData.scIdx, 1);
    fromZone.shortcuts.splice(toIdx > dragData.scIdx ? toIdx - 1 : toIdx, 0, item);
  } else {
    if (toZone.shortcuts.length >= toZone.cols * toZone.rows) return;
    const [item] = fromZone.shortcuts.splice(dragData.scIdx, 1);
    toZone.shortcuts.splice(toIdx, 0, item);
  }
  dragData = null; saveData(); render();
}
document.addEventListener('dragend', () => {
  dragData = null;
  document.querySelectorAll('.shortcut').forEach(el => el.style.opacity = '');
});

function openModal(id) {
  document.getElementById(id).classList.add('active');
  const fi = document.querySelector(`#${id} input`);
  if (fi) setTimeout(() => fi.focus(), 50);
}
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

document.getElementById('add-zone-btn').addEventListener('click', () => {
  editingZoneId = null;
  document.getElementById('zone-modal-title').textContent = 'New Zone';
  document.getElementById('zone-name').value = '';
  document.getElementById('zone-cols').value = 3;
  document.getElementById('zone-rows').value = 2;
  document.getElementById('zone-modal-confirm').textContent = 'Create';
  openModal('zone-modal');
});

document.getElementById('zone-modal-confirm').addEventListener('click', () => {
  const name = document.getElementById('zone-name').value.trim() || 'Untitled';
  const cols = Math.max(1, Math.min(12, parseInt(document.getElementById('zone-cols').value) || 3));
  const rows = Math.max(1, Math.min(12, parseInt(document.getElementById('zone-rows').value) || 2));
  if (editingZoneId) {
    const zone = zones.find(z => z.id === editingZoneId);
    if (zone) { zone.name = name; zone.cols = cols; zone.rows = rows; }
    editingZoneId = null;
  } else {
    zones.push({ id: uid(), name, cols, rows, shortcuts: [] });
  }
  saveData(); render(); closeModal('zone-modal');
});

function openShortcutModal(zoneId, idx) {
  activeZoneId = zoneId;
  editingShortcut = idx !== undefined ? { zoneId, idx } : null;
  if (editingShortcut) {
    const zone = zones.find(z => z.id === zoneId);
    const sc = zone?.shortcuts[idx];
    document.getElementById('shortcut-modal-title').textContent = 'Edit Shortcut';
    document.getElementById('shortcut-url').value = sc?.url || '';
    document.getElementById('shortcut-label').value = sc?.label || '';
    document.getElementById('shortcut-icon-url').value = sc?.customIcon || '';
    document.getElementById('shortcut-modal-confirm').textContent = 'Save';
  } else {
    document.getElementById('shortcut-modal-title').textContent = 'Add Shortcut';
    document.getElementById('shortcut-url').value = '';
    document.getElementById('shortcut-label').value = '';
    document.getElementById('shortcut-icon-url').value = '';
    document.getElementById('shortcut-modal-confirm').textContent = 'Add';
  }
  openModal('shortcut-modal');
}

document.getElementById('shortcut-modal-confirm').addEventListener('click', () => {
  let url = document.getElementById('shortcut-url').value.trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  const label = document.getElementById('shortcut-label').value.trim() || labelFromUrl(url);
  const customIcon = document.getElementById('shortcut-icon-url').value.trim() || '';
  if (editingShortcut) {
    const zone = zones.find(z => z.id === editingShortcut.zoneId);
    if (zone && zone.shortcuts[editingShortcut.idx]) {
      zone.shortcuts[editingShortcut.idx].url = url;
      zone.shortcuts[editingShortcut.idx].label = label;
      zone.shortcuts[editingShortcut.idx].customIcon = customIcon;
    }
    editingShortcut = null;
  } else {
    const zone = zones.find(z => z.id === activeZoneId);
    if (!zone || zone.shortcuts.length >= zone.cols * zone.rows) return;
    zone.shortcuts.push({ url, label, customIcon });
  }
  saveData(); render(); closeModal('shortcut-modal');
});

function showCtxMenu(x, y, zoneId) {
  activeZoneId = zoneId;
  closeAllCtx();
  const menu = document.getElementById('ctx-menu');
  positionMenu(menu, x, y);
  menu.classList.add('active');
}

document.getElementById('ctx-edit').addEventListener('click', () => {
  const zone = zones.find(z => z.id === activeZoneId);
  if (!zone) return;
  editingZoneId = zone.id;
  document.getElementById('zone-modal-title').textContent = 'Edit Zone';
  document.getElementById('zone-name').value = zone.name;
  document.getElementById('zone-cols').value = zone.cols;
  document.getElementById('zone-rows').value = zone.rows;
  document.getElementById('zone-modal-confirm').textContent = 'Save';
  openModal('zone-modal');
});

document.getElementById('ctx-delete').addEventListener('click', () => {
  zones = zones.filter(z => z.id !== activeZoneId);
  saveData(); render();
});

function showScCtxMenu(x, y, zoneId, idx) {
  scCtxTarget = { zoneId, idx };
  closeAllCtx();
  const menu = document.getElementById('sc-ctx-menu');
  positionMenu(menu, x, y);
  menu.classList.add('active');
}

function positionMenu(menu, x, y) {
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  requestAnimationFrame(() => {
    const rect = menu.getBoundingClientRect();
    if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 8) + 'px';
    if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 8) + 'px';
  });
}

function closeAllCtx() { document.querySelectorAll('.ctx-menu').forEach(m => m.classList.remove('active')); }

document.getElementById('sc-ctx-rename').addEventListener('click', () => {
  if (!scCtxTarget) return;
  const zone = zones.find(z => z.id === scCtxTarget.zoneId);
  const sc = zone?.shortcuts[scCtxTarget.idx];
  if (!sc) return;
  const newName = prompt('Rename shortcut:', sc.label);
  if (newName !== null && newName.trim()) { sc.label = newName.trim(); saveData(); render(); }
});

document.getElementById('sc-ctx-change-url').addEventListener('click', () => {
  if (!scCtxTarget) return;
  const zone = zones.find(z => z.id === scCtxTarget.zoneId);
  const sc = zone?.shortcuts[scCtxTarget.idx];
  if (!sc) return;
  const newUrl = prompt('New URL:', sc.url);
  if (newUrl !== null && newUrl.trim()) {
    let url = newUrl.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    sc.url = url;
    saveData(); render();
  }
});

document.getElementById('sc-ctx-change-icon').addEventListener('click', () => {
  if (!scCtxTarget) return;
  document.getElementById('icon-modal-url').value = '';
  openModal('icon-modal');
  setTimeout(() => document.getElementById('icon-modal-url').focus(), 50);
});

document.getElementById('icon-modal-upload-btn').addEventListener('click', () => {
  document.getElementById('icon-file-input').click();
});

document.getElementById('icon-modal-confirm').addEventListener('click', () => {
  const url = document.getElementById('icon-modal-url').value.trim();
  if (!url) return;
  const zone = zones.find(z => z.id === scCtxTarget?.zoneId);
  const sc = zone?.shortcuts[scCtxTarget?.idx];
  if (sc) { sc.customIcon = url; saveData(); render(); }
  closeModal('icon-modal');
});

document.getElementById('icon-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file || !scCtxTarget) return;
  const reader = new FileReader();
  reader.onload = () => {
    const zone = zones.find(z => z.id === scCtxTarget.zoneId);
    const sc = zone?.shortcuts[scCtxTarget.idx];
    if (sc) { sc.customIcon = reader.result; saveData(); render(); }
    closeModal('icon-modal');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

document.getElementById('sc-ctx-remove').addEventListener('click', () => {
  if (!scCtxTarget) return;
  const zone = zones.find(z => z.id === scCtxTarget.zoneId);
  if (zone) { zone.shortcuts.splice(scCtxTarget.idx, 1); saveData(); render(); }
});

document.addEventListener('click', () => closeAllCtx());

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(overlay.id); });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
    closeAllCtx(); closeSettings();
  }
  if (e.key === 'Enter') {
    if (document.getElementById('shortcut-modal').classList.contains('active')) document.getElementById('shortcut-modal-confirm').click();
    else if (document.getElementById('zone-modal').classList.contains('active')) document.getElementById('zone-modal-confirm').click();
  }
});

applySettings();
bindSettingsInputs();
render();
initSearch();
initClock();

function initClock() {
  const timeEl = document.getElementById('clock-time');
  const dateEl = document.getElementById('clock-date');
  const trayEl = document.getElementById('xp-tray-time');
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function tick() {
    const now = new Date();
    const h = now.getHours();
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 || 12;
    timeEl.textContent = `${h12}:${m}:${s} ${ampm}`;
    dateEl.textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    if (trayEl) trayEl.textContent = `${h12}:${m} ${ampm}`;
  }

  tick();
  setInterval(tick, 1000);
}

function initSearch() {
  const input = document.getElementById('search-input');

  input.addEventListener('input', () => applySearch(input.value.trim()));

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      input.value = '';
      applySearch('');
      input.blur();
    } else if (e.key === 'Enter') {
      const q = input.value.trim();
      if (!q) return;
      // Find first visible match
      const first = document.querySelector('.shortcut.search-match');
      if (first) {
        first.click();
      } else {
        // Fallback: web search
        const searchEngine = 'https://www.google.com/search?q=';
        window.location.href = searchEngine + encodeURIComponent(q);
      }
      input.value = '';
      applySearch('');
    }
  });

  // Focus search on '/' or letter keys outside of inputs
  document.addEventListener('keydown', (e) => {
    if (document.activeElement.tagName === 'INPUT') return;
    if (e.key === '/' || (/^[a-zA-Z0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey)) {
      e.preventDefault();
      input.focus();
      if (e.key !== '/') { input.value = e.key; applySearch(e.key); }
    }
  });
}

function applySearch(q) {
  const shortcuts = document.querySelectorAll('.shortcut');
  if (!q) {
    shortcuts.forEach(el => { el.classList.remove('search-hidden', 'search-dim', 'search-match'); });
    return;
  }
  const lower = q.toLowerCase();
  let firstMatch = null;
  shortcuts.forEach(el => {
    const label = (el.querySelector('.shortcut-label')?.textContent || '').toLowerCase();
    const url = (el.title || '').toLowerCase();
    const matches = label.includes(lower) || url.includes(lower);
    el.classList.toggle('search-dim', !matches);
    el.classList.toggle('search-match', matches);
    el.classList.remove('search-hidden');
    if (matches && !firstMatch) firstMatch = el;
  });
}
</script>

    <span id="xp-tray-time"></span>
  </div>
</div>

  document.getElementById('xp-start-btn').addEventListener('click', openSettings);
